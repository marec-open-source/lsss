<svg xmlns="http://www.w3.org/2000/svg" width="515" height="355" viewBox="0 0 515 355"
     font-family="sans-serif" font-size="14" text-anchor="middle">

   <defs>
      <path id="disk" d="M 0,0
           a 70,8 0,0,0 140,0
           a 70,8 0,0,0 -140,0
           l 0,45
           a 70,8 0,0,0 140,0
           l 0,-45"/>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
         <path d="M0,0 L10,5 0,10 z"/>
      </marker>
   </defs>
   <g transform="translate(0.5, 0.5)">
      <g fill="none" stroke="black" stroke-width="1">
         <rect x="5" y="5" width="190" height="345"/>
         <use href="#disk" x="30" y="45"/>
         <rect x="30" y="125" width="140" height="45" rx="5" fill="#ffffe0"/>
         <use href="#disk" x="30" y="205"/>
         <rect x="30" y="285" width="140" height="45"/>
         <line x1="100" y1="98" x2="100" y2="120" marker-end="url(#arrow)"/>
         <line x1="100" y1="170" x2="100" y2="191" marker-end="url(#arrow)"/>
         <line x1="100" y1="258" x2="100" y2="280" marker-end="url(#arrow)"/>

         <rect x="320" y="5" width="190" height="345"/>
         <use href="#disk" x="345" y="45"/>
         <rect x="345" y="125" width="140" height="45" rx="5" fill="#ffffe0"/>
         <use href="#disk" x="345" y="205"/>
         <rect x="345" y="285" width="140" height="45"/>
         <line x1="415" y1="125" x2="415" y2="103" marker-end="url(#arrow)"/>
         <line x1="415" y1="197" x2="415" y2="175" marker-end="url(#arrow)"/>

         <line x1="170" y1="225" x2="340" y2="225" marker-end="url(#arrow)"/>
         <line x1="170" y1="315" x2="340" y2="315" marker-end="url(#arrow)"/>
      </g>

      <g fill="black">
         <text x="10" y="25" font-weight="bold" text-anchor="start">On platform</text>
         <text x="100" y="80">Ship DB</text>
         <text x="100" y="143">LSSS export of</text>
         <text x="100" y="163">database</text>
         <text x="100" y="230">Exported survey(s)</text>
         <text x="100" y="250">HSQLDB</text>
         <text x="100" y="303">Dump to</text>
         <text x="100" y="323">text files</text>

         <text x="325" y="25" font-weight="bold" text-anchor="start">On shore</text>
         <text x="415" y="80">Main DB</text>
         <text x="415" y="143">LSSS import of</text>
         <text x="415" y="163">database</text>
         <text x="415" y="230">Exported servey(s)</text>
         <text x="415" y="250">HSQLDB</text>
         <text x="415" y="313">Text files</text>

         <text x="255" y="245">HSQLDB files</text>
         <text x="255" y="265">and text files</text>
         <text x="255" y="285">are copied</text>
         <text x="255" y="305">from platform</text>
      </g>
   </g>
</svg>
