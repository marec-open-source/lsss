<svg xmlns="http://www.w3.org/2000/svg" width="395" height="218" viewBox="0 -100 395 218"
     fill="none">

   <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
         <path d="M0,0 L10,5 0,10 z" fill="black"/>
      </marker>
   </defs>

   <path stroke="black" stroke-width="2" d="M2,0 H393 M210,0 v-40"/>

   <g stroke="black" stroke-width="2">
      <line x1="250" y1="-60" x2="220" y2="-35" marker-end="url(#arrow)"/>
      <line x1="100" y1="-50" x2="147" y2="-17" marker-end="url(#arrow)"/>
      <line x1="150" y1="70" x2="150" y2="30" marker-end="url(#arrow)"/>
   </g>

   <path stroke="#23b8dc" stroke-width="2" d="
         M75,-10 v20
         M155,-10 v20
         M240,-10 v20
         M265,-10 v20
         M290,-10 v20
   "/>

   <path stroke="#b84747" stroke-width="2" d="
         M140,0 v20
