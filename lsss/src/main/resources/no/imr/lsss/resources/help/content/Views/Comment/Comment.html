<h1>Comments</h1>
<p>
   This module displays comments in a table.
   Comments can be added via the echogram <a href="../Echogram/Echogram.html#ContextMenu">context menu</a>.
</p>
<p>
   Comments are also displayed as overlays on the <a href="../Echogram/Echogram.html#CommentEchogramOverlay">echogram</a>
   and on the <a href="../Map/Map.html#CommentMapOverlay">map</a>.
</p>
<p>
   Comments are stored in <a href="../../WorkingWith/WorkFiles/WorkFiles.html">work files</a>
   and in the database <a href="../../Database/Tables/ObservationComment.html">ObservationComment</a> table.
</p>
