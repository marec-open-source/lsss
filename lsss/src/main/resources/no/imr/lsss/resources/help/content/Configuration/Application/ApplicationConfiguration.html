<h1>Application configuration</h1>
<figure>
   <img width="798" height="500" src="ApplicationConfiguration.png">
</figure>
<p>
   The application configuration is common for all surveys.
   This configuration is stored in <a href="../../Appendices/FileTypes/FileTypes.html#DefaultConfigurationFiles">one file</a> that is shared across all surveys.
   The current settings are stored to that file when storing a survey, and
   can also be saved from the application configuration main tab.
</p>
