<h1>Survey configuration</h1>
<figure>
   <img src="SurveyConfiguration.png" height="501" width="799">
</figure>
<p>
   The configuration for each survey is stored in a separate file with extension lsss.
   The location of this file is selected when <a href="../../WorkingWith/NewSurvey/NewSurvey.html">setting up a new survey</a>.
</p>
<p>
   From the main tab for the survey configuration, the current settings can also be saved as
   <a href="../../Appendices/FileTypes/FileTypes.html#DefaultConfigurationFiles">default settings</a>.
</p>
