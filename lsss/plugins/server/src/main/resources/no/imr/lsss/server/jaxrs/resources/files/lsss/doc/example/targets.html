<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>LSSS server</title>
   <link rel="icon" href="../lsss.svg">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
   <link rel="stylesheet" href="../style.css">
</head>
<body class="container-fluid">

<h1>Target detection sensitivity analysis</h1>
<p>
   Single targets in the currently selected region for different values of <span id="parameter"></span>.
</p>

<div id="content"></div>

<script>
   (function () {
      'use strict';

      let uniquifier = Date.now();

      const parameterName = 'MaxGainCompensation';
      const minValue = 0;
      const maxValue = 10;
      const deltaValue = 0.5;

      document.getElementById('parameter').textContent = parameterName;
      const content = document.getElementById('content');

      function nextImage(value) {
         if (value > maxValue) {
            return;
         }
         fetch('/lsss/module/TSModule/config/parameter/' + parameterName, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({value: value}),
         })
               .then(() => fetch('/lsss/data/wait'))
               .then(() => {
                  content.appendChild(document.createElement('h2')).textContent = parameterName + ' = ' + value;
                  const img = content.appendChild(document.createElement('img'));
                  img.src = '/lsss/module/TSModule/image?uniquifier=' + uniquifier++;
                  img.addEventListener('load', () => {
                     nextImage(value + deltaValue);
                  });
               });
      }

      fetch('/lsss/module/TSModule/enabled')
            .then(response => response.json())
            .then(data => {
               if (data.value) {
                  nextImage(minValue);
               } else {
                  content.textContent = 'Please enable the TS module.';
               }
            });
   })();
</script>
</body>
</html>
