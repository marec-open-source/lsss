@let error = this.error();
@if (error) {
   <div class="marec-error-message">
      <h1>
         Http error
      </h1>
      <p>
         Status:<br>
         {{ error.status }} {{ error.statusText }}
      </p>
      <p>
         Message:<br>
         {{ error.error }}
      </p>
      <p>
         URL:<br>
         {{ error.url }}
      </p>
   </div>
}
