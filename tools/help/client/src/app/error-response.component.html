@let error = this.error();
@if (error) {
   <div class="marec-error-message">
      <h1>Http error</h1>
      <p>
         Message:<br>
         {{ error.message }}
      </p>
      <p>
         Error:<br>
         {{ error.error }}
      </p>
      <p>
         Status code:<br>
         {{ error.status }}
      </p>
      <p>
         URL:<br>
         {{ error.url }}
      </p>
   </div>
}
