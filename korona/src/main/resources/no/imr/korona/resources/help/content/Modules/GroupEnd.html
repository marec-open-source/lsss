<h1>Group end module</h1>
<p>
   This module marks the end of a <a href="CommentModule.html#ModuleGroups">module group</a>.
   A corresponding Group end module is automatically added or removed when the <a href="CommentModule.html">Comment module</a>
   parameter <a class="marec-parameter-ref" href="CommentModule.html#GroupStart">Start module group</a> is checked or unchecked.
</p>
