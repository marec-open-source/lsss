<h1>Ping thinning module</h1>
<p>
   Removes pings.
</p>

<h2 id="Parameters">Parameters</h2>
<ul>
   <li><span class="marec-parameter-def" id="Active">Active:</span>
      If the module is not active, then all datagrams pass unaltered through it.
   </li>
   <li><span class="marec-parameter-def" id="PingsToSkipInitially">Initial skip:</span>
      The number of pings to skip initially.
   </li>
   <li><span class="marec-parameter-def" id="PingsToSkip">Periodical skip:</span>
      The number of pings to skip between each included ping.
   </li>
</ul>
